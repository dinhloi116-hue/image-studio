<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Studio</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="box">
    <div class="brand">
      <div class="logo">IS</div>
      <div><h1>Image Studio</h1><p id="ver">Extension v1.0.0</p></div>
    </div>
    <button id="open" class="btn primary">Mở Image Studio</button>
    <button id="update" class="btn success">Cập nhật từ GitHub</button>
    <button id="download" class="btn secondary hidden">Tải extension mới</button>
    <div id="status" class="status">Sẵn sàng.</div>
    <div class="small">Tool chạy từ GitHub Pages. Bấm cập nhật để bỏ cache và nạp bản Git mới nhất.</div>
  </main>
<script src="popup.js"></script>
</body>
</html>
