name: R19.9 FFmpeg audio
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r199-ffmpeg-audio.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build R19.9 assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          echo '' | base64 -d | gzip -d > assets/video-compressor-r199.js
          echo '' | base64 -d | gzip -d > assets/ffmpeg-worker-r199.js
          curl -L --fail --retry 3 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd/ffmpeg-core.js' -o assets/ffmpeg-core.js
          curl -L --fail --retry 3 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd/ffmpeg-core.wasm' -o assets/ffmpeg-core.wasm
          test $(stat -c%s assets/ffmpeg-core.js) -gt 100000
          test $(stat -c%s assets/ffmpeg-core.wasm) -gt 20000000
          grep -q 'createFFmpegCore' assets/ffmpeg-core.js
          node --check assets/video-compressor-r199.js
          node --check assets/ffmpeg-worker-r199.js
          python - <<'PY2'
          from pathlib import Path
          import re
          repl='<script src="/image-studio/assets/video-compressor-r199.js?v=r199-ffmpeg-audio"></script>'
          pat=r'<script src="/image-studio/assets/video-compressor(?:-r199)?\.js\?v=[^"]+"></script>'
          for p in [Path('index.html'),Path('direct/index.html')]:
              s=p.read_text(encoding='utf-8')
              s2,n=re.subn(pat,repl,s)
              if n!=1:
                  raise SystemExit(f'Expected 1 video compressor ref in {p}, got {n}')
              p.write_text(s2,encoding='utf-8')
          Path('direct/version.txt').write_text('R19.9-FFMPEG-AUDIO\n',encoding='utf-8')
          PY2
          grep -q 'r199-ffmpeg-audio' direct/index.html
          grep -q 'R19.9-ffmpeg-audio' assets/video-compressor-r199.js
      - name: Commit R19.9
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/video-compressor-r199.js assets/ffmpeg-worker-r199.js assets/ffmpeg-core.js assets/ffmpeg-core.wasm index.html direct/index.html direct/version.txt
          git commit -m 'R19.9: mux original audio with FFmpeg' || exit 0
          git push
