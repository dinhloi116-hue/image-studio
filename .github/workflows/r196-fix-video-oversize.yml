name: R19.6 video compression safety fix
on:
  push:
    paths:
      - '.github/workflows/r196-fix-video-oversize.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch video compressor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/video-compressor.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('if(window.__VIDCOMP_R195)return; window.__VIDCOMP_R195=1;','if(window.__VIDCOMP_R196)return; window.__VIDCOMP_R196=1;')
          s=s.replace('Chrome dùng VBR nên thực tế có thể lệch khoảng 5–15%.','Tool tự <b>đo bitrate thực tế vài giây trước khi nén</b> để bám gần % bạn chọn. Kết quả lớn hơn file gốc sẽ luôn bị chặn.')
          s=s.replace('Tự động - ưu tiên MP4</option>','Tự động - MP4, nếu vượt dung lượng sẽ thử WebM</option>')
          old="function outputMime(){let f=cfg().fmt;let mp=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1.42E01E','video/mp4'];let wb=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];let all=f==='mp4'?mp:f==='webm'?wb:[...mp,...wb];return all.find(m=>MediaRecorder.isTypeSupported(m))||''}\n  function bitrate(x){let c=cfg(),t=targetBytes(x),total=Math.max(300000,t*8/Math.max(.1,x.d)*.94),audio=c.a*1000,video=Math.max(220000,(total-audio)*2.3);return {video,audio,total,target:t}}"
          new="function outputMime(force=''){let f=force||cfg().fmt;let mp=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1.42E01E','video/mp4'];let wb=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];let all=f==='mp4'?mp:f==='webm'?wb:[...mp,...wb];return all.find(m=>MediaRecorder.isTypeSupported(m))||''}\n  function bitrate(x,mime='',scale=1){let c=cfg(),t=targetBytes(x),dur=Math.max(.1,x.d),audio=c.a*1000,origTotal=x.file.size*8/dur,targetTotal=Math.max(300000,t*8/dur),video=Math.max(180000,(targetTotal-audio)*scale);video=Math.min(video,Math.max(180000,origTotal*.95-audio));return {video,audio,total:targetTotal,target:t,origTotal}}"
          assert old in s, 'bitrate block not found'
          s=s.replace(old,new)
          s=s.replace('function qualityWarn(x){let b=bitrate(x).video','function qualityWarn(x){let b=bitrate(x,outputMime()).video')
          marker="  async function encode(x,idx,total){"
          calib=r'''  async function calibrateBitrate(x,idx,total,mt){
            if(x.d<5)return bitrate(x,mt).video;
            const c=cfg(),base=bitrate(x,mt).video,desired=targetBytes(x)*8/Math.max(.1,x.d),sampleSec=Math.min(3.5,Math.max(2,x.d*.12));
            const start=Math.max(0,Math.min(x.d*.18,Math.max(0,x.d-sampleSec-.5)));
            const {v,url}=freshVideo(x.file);await waitReady(v);const [ow,oh]=dims(x);let ac=null,stream=null,rawStream=null,drawTimer=null;
            try{
              if(start>.05){v.currentTime=start;await new Promise(r=>{let done=0,tm=setTimeout(()=>{if(done)return;done=1;r()},1800);v.onseeked=()=>{if(done)return;done=1;clearTimeout(tm);r()}})}
              let videoTrack=null;const sameSize=ow===x.w-(x.w%2)&&oh===x.h-(x.h%2),canDirect=typeof v.captureStream==='function'&&sameSize;
              if(canDirect){rawStream=v.captureStream();videoTrack=rawStream.getVideoTracks()[0]||null}
              if(!videoTrack){let canvas=document.createElement('canvas');canvas.width=ow;canvas.height=oh;let cx=canvas.getContext('2d',{alpha:false});stream=canvas.captureStream(c.fps);videoTrack=stream.getVideoTracks()[0];drawTimer=setInterval(()=>{try{cx.drawImage(v,0,0,ow,oh)}catch(_){}},Math.max(16,1000/c.fps))}
              let audioTracks=[];if(c.a>0){try{let AC=window.AudioContext||window.webkitAudioContext;ac=new AC();await ac.resume();let source=ac.createMediaElementSource(v),dest=ac.createMediaStreamDestination(),gain=ac.createGain();gain.gain.value=0;source.connect(dest);source.connect(gain);gain.connect(ac.destination);audioTracks=dest.stream.getAudioTracks()}catch(e){}}
              const ms=new MediaStream([videoTrack,...audioTracks]),opts={mimeType:mt,videoBitsPerSecond:base};if(c.a>0)opts.audioBitsPerSecond=c.a*1000;
              const rec=new MediaRecorder(ms,opts),chunks=[];let timer=null,aborted=false;
              setStatus(`Đang đo bitrate thực tế ${idx+1}/${total}: ${x.name} • ~${sampleSec.toFixed(1)} giây`);
              const blob=await new Promise(async(resolve,reject)=>{rec.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};rec.onerror=()=>reject(Error('Không đo được bitrate codec'));rec.onstop=()=>{clearInterval(timer);if(aborted)return reject(Object.assign(Error('Đã dừng'),{name:'AbortError'}));let b=new Blob(chunks,{type:mt});b.size?resolve(b):reject(Error('Không đo được bitrate codec'))};timer=setInterval(()=>{if(v.currentTime>=start+sampleSec||v.ended){try{if(rec.state!=='inactive')rec.stop()}catch(_){}}},80);S.stopCurrent=()=>{aborted=true;try{v.pause()}catch(_){}try{if(rec.state!=='inactive')rec.stop()}catch(_){}};try{rec.start(500);await v.play()}catch(e){clearInterval(timer);reject(Error('Không chạy được bước đo bitrate'))}});
              const mediaSec=Math.max(.5,Math.min(sampleSec,Math.max(0,v.currentTime-start))),actual=blob.size*8/mediaSec;let factor=desired/Math.max(1,actual);factor=Math.max(.3,Math.min(3.5,factor));const adjusted=Math.max(180000,Math.min(100000000,base*factor));console.info('Video calibration',{name:x.name,base,actual,desired,factor,adjusted});return adjusted;
            }finally{clearInterval(drawTimer);S.stopCurrent=null;try{v.pause()}catch(_){}try{rawStream?.getTracks().forEach(t=>t.stop())}catch(_){}try{stream?.getTracks().forEach(t=>t.stop())}catch(_){}try{ac?.close()}catch(_){}URL.revokeObjectURL(url)}
          }
'''
          assert marker in s, 'encode marker not found'
          s=s.replace(marker,calib+"  async function encode(x,idx,total,forceFmt=''){")
          s=s.replace("    const c=cfg(), mt=outputMime(); if(!mt)throw Error('Chrome không hỗ trợ định dạng xuất đã chọn');\n    const {v,url}=freshVideo(x.file);","    const c=cfg(), mt=outputMime(forceFmt); if(!mt)throw Error('Chrome không hỗ trợ định dạng xuất đã chọn');\n    const tunedVideo=await calibrateBitrate(x,idx,total,mt);\n    const {v,url}=freshVideo(x.file);")
          s=s.replace('const ms=new MediaStream([videoTrack,...audioTracks]); const br=bitrate(x); const opts={mimeType:mt,videoBitsPerSecond:br.video};','const ms=new MediaStream([videoTrack,...audioTracks]); const br=bitrate(x,mt); br.video=tunedVideo; const opts={mimeType:mt,videoBitsPerSecond:br.video};')
          old2="const pm=await probeBlob(blob); const tol=Math.max(.75,x.d*.03), delta=Math.abs(pm.d-x.d); if(delta>tol){URL.revokeObjectURL(pm.url);throw Error(`Sai thời lượng: gốc ${x.d.toFixed(2)}s nhưng file nén ${pm.d.toFixed(2)}s. Kết quả đã bị chặn, không cho tải.`)}\n      return {blob,mime:mt,dur:pm.d,url:pm.url,w:pm.w,h:pm.h};"
          new2="const pm=await probeBlob(blob); const tol=Math.max(.75,x.d*.03), delta=Math.abs(pm.d-x.d); if(delta>tol){URL.revokeObjectURL(pm.url);throw Error(`Sai thời lượng: gốc ${x.d.toFixed(2)}s nhưng file nén ${pm.d.toFixed(2)}s. Kết quả đã bị chặn, không cho tải.`)}\n      const target=targetBytes(x),source=x.file.size,tooBig=blob.size>=source*.98,farOver=target>0&&blob.size>target*1.30;if(tooBig||farOver){URL.revokeObjectURL(pm.url);const e=Error(tooBig?`Kết quả ${fmt(blob.size)} không nhỏ hơn file gốc ${fmt(source)}. Tool đã chặn, không coi đây là nén thành công.`:`Kết quả ${fmt(blob.size)} vượt quá xa mục tiêu ${fmt(target)}.`);e.code=tooBig?'OVERSIZE':'MISSTARGET';e.usedMime=mt;throw e}\n      return {blob,mime:mt,dur:pm.d,url:pm.url,w:pm.w,h:pm.h};"
          assert old2 in s, 'duration block not found'
          s=s.replace(old2,new2)
          old3="async function runItem(i,idx=0,total=1){let x=S.items[i];if(!x)return; if(x.outUrl){URL.revokeObjectURL(x.outUrl);x.outUrl=''}x.out=null;x.valid=false;x.err='';x.work=true;x.progress=0;render();try{let r=await encode(x,idx,total);x.out=r.blob;x.outUrl=r.url;x.outDur=r.dur;x.mime=r.mime;x.valid=true;x.progress=100}catch(e){if(e.name==='AbortError')throw e;x.err=e.message}finally{x.work=false;render()}}"
          new3="async function runItem(i,idx=0,total=1){let x=S.items[i];if(!x)return;if(x.outUrl){URL.revokeObjectURL(x.outUrl);x.outUrl=''}x.out=null;x.valid=false;x.err='';x.codecNote='';x.work=true;x.progress=0;render();try{let r;try{r=await encode(x,idx,total)}catch(e){let canFallback=(e.code==='OVERSIZE'||e.code==='MISSTARGET')&&cfg().fmt==='auto'&&outputMime('webm')&&!(e.usedMime||'').includes('webm');if(!canFallback)throw e;setStatus(`MP4 không đạt mục tiêu với ${x.name}. Đang thử WebM từ file gốc...`);x.codecNote='MP4 vượt dung lượng → tự chuyển WebM';r=await encode(x,idx,total,'webm')}x.out=r.blob;x.outUrl=r.url;x.outDur=r.dur;x.mime=r.mime;x.valid=true;x.progress=100}catch(e){if(e.name==='AbortError')throw e;x.err=e.message}finally{x.work=false;render()}}"
          assert old3 in s, 'runItem block not found'
          s=s.replace(old3,new3)
          s=s.replace("đã nén ${fmt(S.items.reduce((a,x)=>a+(x.out?.size||0),0))}","đã nén ${fmt(S.items.reduce((a,x)=>a+(x.out&&x.valid?x.out.size:0),0))}")
          s=s.replace("${x.out&&x.valid?'<span class=\"vc5-badge ok\">✓ đủ thời lượng</span>':''}","${x.out&&x.valid?'<span class=\"vc5-badge ok\">✓ đủ thời lượng</span>':''}${x.codecNote?`<span class=\"vc5-badge warn\">${esc(x.codecNote)}</span>`:''}")
          s=s.replace("S.items.push({file,name:file.name,srcUrl,d:m.d,w:m.w,h:m.h,out:null,outUrl:'',outDur:0,mime:'',progress:0,work:false,err:'',valid:false})","S.items.push({file,name:file.name,srcUrl,d:m.d,w:m.w,h:m.h,out:null,outUrl:'',outDur:0,mime:'',progress:0,work:false,err:'',valid:false,codecNote:''})")
          s=s.replace('window.videoCompressor={S,addFiles,runAll,runOne,show};render();',"window.videoCompressor={S,addFiles,runAll,runOne,show,version:'R19.6-calibrated'};render();")
          p.write_text(s,encoding='utf-8')
          for hp in [Path('index.html'),Path('direct/index.html')]:
            if hp.exists():
              h=hp.read_text(encoding='utf-8').replace('video-compressor.js?v=r195-stable','video-compressor.js?v=r196-calibrated-safe')
              hp.write_text(h,encoding='utf-8')
          PY
      - name: Commit patched version
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/video-compressor.js index.html direct/index.html
          git diff --cached --quiet || git commit -m 'R19.6: calibrate bitrate and block oversized video outputs'
          git push