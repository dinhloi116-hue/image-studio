name: Build Local Image Studio Extension

on:
  push:
    branches: [main]
    paths:
      - 'direct/index.html'
      - 'direct/version.txt'
      - 'assets/video-compressor-r199.js'
      - 'assets/video-compressor-core-r199.js'
      - 'assets/nameset-paste-r205.js'
      - 'assets/nameset-layer-toggle-r206.js'
      - 'assets/halftone-help-r203.js'
      - 'assets/halftone-zoom-r202.js'
      - 'assets/halftone-r200.js'
      - 'assets/stroke-hq-r204.js'
      - 'assets/ffmpeg-worker-r199.js'
      - 'assets/ffmpeg-core.js'
      - 'assets/ffmpeg-core.wasm'
      - '.github/workflows/build-local-extension.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build self-contained extension
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json, shutil, os

          root=Path('.')
          ext=root/'chrome-extension'
          scripts=ext/'tool-scripts'
          assets=ext/'assets'
          scripts.mkdir(parents=True,exist_ok=True)
          assets.mkdir(parents=True,exist_ok=True)

          # Clear generated JS only; keep popup/app legacy files harmlessly for now.
          for p in scripts.glob('*.js'): p.unlink()

          html=(root/'direct/index.html').read_text(encoding='utf-8')
          counter=0

          script_re=re.compile(r'<script(?P<attrs>[^>]*)>(?P<body>.*?)</script>',re.I|re.S)
          def repl(m):
              global counter
              attrs=m.group('attrs') or ''
              body=m.group('body') or ''
              srcm=re.search(r'\bsrc=["\']([^"\']+)["\']',attrs,re.I)
              typem=re.search(r'\btype=["\']([^"\']+)["\']',attrs,re.I)
              typ=(typem.group(1).lower().strip() if typem else '')
              if srcm:
                  src=srcm.group(1)
                  if 'video-compressor-r199.js' in src:
                      return '<script src="assets/video-compressor-r199.js"></script>'
                  return m.group(0)
              if typ and typ not in ('text/javascript','application/javascript','module'):
                  return m.group(0)
              if not body.strip():
                  return ''
              counter+=1
              name=f's{counter:02d}.js'
              (scripts/name).write_text(body.strip()+'\n',encoding='utf-8')
              module=' type="module"' if typ=='module' else ''
              return f'<script{module} src="tool-scripts/{name}"></script>'

          html=script_re.sub(repl,html)
          html=html.replace('</body>','<script src="assets/stroke-hq-r204.js"></script>\\n<script src="assets/halftone-r200.js"></script>\\n<script src="assets/halftone-zoom-r202.js"></script>\\n<script src="assets/nameset-paste-r205.js"></script>\\n<script src="assets/nameset-layer-toggle-r206.js"></script>\\n<script src="extension-update.js"></script>\\n</body>')
          html=html.replace('<title>Image Studio R19</title>','<title>Image Studio DHL - Local</title>')
          (ext/'tool.html').write_text(html,encoding='utf-8')

          # Copy video/FFmpeg engine inside the extension so it runs locally.
          for name in ['video-compressor-r199.js','video-compressor-core-r199.js','ffmpeg-worker-r199.js','ffmpeg-core.js','ffmpeg-core.wasm','stroke-hq-r204.js','halftone-r200.js','halftone-zoom-r202.js','halftone-help-r203.js','nameset-paste-r205.js','nameset-layer-toggle-r206.js']:
              shutil.copy2(root/'assets'/name, assets/name)

          vp=assets/'video-compressor-r199.js'
          v=vp.read_text(encoding='utf-8')
          if 'function assetBase()' in v:
              v=re.sub(r"function assetBase\(\)\{return .*?\}","function assetBase(){return new URL('assets/', location.href).href}",v,count=1)
              vp.write_text(v,encoding='utf-8')

          version=(root/'direct/version.txt').read_text(encoding='utf-8').strip()
          sha=os.environ.get('GITHUB_SHA','')
          meta={'tool_version':version,'source_sha':sha,'updated_at':os.environ.get('GITHUB_RUN_ID','')}
          (ext/'local-version.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          manifest={
            'manifest_version':3,
            'name':'Image Studio DHL - Local',
            'version':'2.0.6',
            'version_name':f'2.0.6 • {version}',
            'description':'Image Studio chạy local. Cập nhật bằng GitHub Desktop Pull origin rồi Reload extension.',
            'permissions':['storage','downloads','tabs','clipboardRead'],
            'host_permissions':['https://raw.githubusercontent.com/*'],
            'background':{'service_worker':'background.js'},
            'icons':{'16':'icons/icon128.png','32':'icons/icon128.png','48':'icons/icon128.png','128':'icons/icon128.png'},
            'action':{'default_title':'Mở Image Studio DHL','default_icon':{'16':'icons/icon128.png','32':'icons/icon128.png','48':'icons/icon128.png','128':'icons/icon128.png'}}
          }
          (ext/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          background="""const TOOL=chrome.runtime.getURL('tool.html');
          chrome.action.onClicked.addListener(async()=>{
            const tabs=await chrome.tabs.query({});
            const found=tabs.find(t=>t.url&&t.url.startsWith(TOOL));
            if(found){await chrome.tabs.update(found.id,{active:true});if(found.windowId)await chrome.windows.update(found.windowId,{focused:true});}
            else await chrome.tabs.create({url:TOOL});
          });
          """
          (ext/'background.js').write_text(background,encoding='utf-8')

          updater="""(()=>{
          const REMOTE='https://raw.githubusercontent.com/dinhloi116-hue/image-studio/main/chrome-extension/local-version.json';
          let local={};
          async function readLocal(){try{local=await (await fetch(chrome.runtime.getURL('local-version.json')+'?t='+Date.now(),{cache:'no-store'})).json()}catch(e){local={}}}
          function box(text,buttons=[]){
            let old=document.getElementById('dhlGitUpdateBox');if(old)old.remove();
            const d=document.createElement('div');d.id='dhlGitUpdateBox';d.style.cssText='position:fixed;right:16px;top:70px;z-index:999999;background:#0b1220;color:#e5e7eb;border:1px solid #3b82f6;border-radius:14px;padding:14px;width:min(430px,calc(100vw - 32px));box-shadow:0 18px 50px #0008;font:14px Segoe UI,Arial';
            d.innerHTML='<div style="font-weight:800;margin-bottom:8px">Cập nhật Image Studio</div><div style="line-height:1.55;color:#cbd5e1">'+text+'</div><div id="dhlGitBtns" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"></div>';
            const row=d.querySelector('#dhlGitBtns');
            buttons.forEach(([label,fn,primary])=>{const b=document.createElement('button');b.textContent=label;b.className='btn';b.style.cssText=primary?'background:#166534;border-color:#22c55e':'';b.onclick=fn;row.appendChild(b)});
            const close=document.createElement('button');close.textContent='Đóng';close.className='btn';close.onclick=()=>d.remove();row.appendChild(close);document.body.appendChild(d);
          }
          async function check(){
            await readLocal();
            try{
              const r=await fetch(REMOTE+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const remote=await r.json();
              const same=remote.source_sha&&local.source_sha&&remote.source_sha===local.source_sha;
              if(same) box('Bạn đang dùng bản Git mới nhất: <b>'+String(local.tool_version||'')+'</b>.');
              else box('Có bản mới trên GitHub.<br><br><b>1.</b> Mở GitHub Desktop → repo <b>image-studio</b> → <b>Pull origin</b>.<br><b>2.</b> Quay lại đây và bấm <b>Áp dụng sau khi Pull</b>.',[
                ['Mở repo GitHub',()=>window.open('https://github.com/dinhloi116-hue/image-studio','_blank'),false],
                ['Áp dụng sau khi Pull',()=>chrome.runtime.reload(),true]
              ]);
            }catch(e){box('Không kiểm tra được GitHub: '+e.message)}
          }
          function add(){
            const host=document.querySelector('.top-actions')||document.querySelector('header')||document.body;
            if(document.getElementById('dhlGitUpdateBtn'))return;
            const b=document.createElement('button');b.id='dhlGitUpdateBtn';b.className='btn';b.textContent='↻ Cập nhật từ Git';b.title='Kiểm tra bản mới. Sau khi Pull origin trong GitHub Desktop, bấm áp dụng để reload extension.';b.onclick=check;host.appendChild(b);
          }
          readLocal().then(add);if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',add);else add();
          })();
          """
          (ext/'extension-update.js').write_text(updater,encoding='utf-8')

          readme=f"""IMAGE STUDIO DHL - LOCAL EXTENSION
          ==================================
          Tool version: {version}

          CÀI LẦN ĐẦU BẰNG GITHUB DESKTOP
          1. GitHub Desktop -> Clone repository: dinhloi116-hue/image-studio
          2. Chrome -> chrome://extensions/
          3. Bật Developer mode
          4. Load unpacked
          5. Chọn thư mục: <repo image-studio>/chrome-extension

          CẬP NHẬT SAU NÀY - GIỐNG TOOL ĐỌC TỒN KHO
          1. GitHub Desktop -> image-studio -> Fetch origin / Pull origin
          2. Trong Image Studio bấm 'Cập nhật từ Git' -> 'Áp dụng sau khi Pull'
             (hoặc chrome://extensions -> Reload)
          3. Mở lại tool.

          KHÔNG cần tải ZIP lại. KHÔNG dùng iframe GitHub Pages.
          """
          (ext/'README_GITHUB_DESKTOP.txt').write_text(readme,encoding='utf-8')
          print(f'Generated {counter} local JS files')
          PY

      - name: Validate generated extension
        run: |
          set -euo pipefail
          python3 -m json.tool chrome-extension/manifest.json >/dev/null
          for f in chrome-extension/background.js chrome-extension/extension-update.js chrome-extension/tool-scripts/*.js; do node --check "$f"; done
          grep -q 'chrome-extension/tool' /dev/null || true
          test -s chrome-extension/tool.html
          test -s chrome-extension/assets/ffmpeg-core.wasm
          test $(stat -c%s chrome-extension/assets/ffmpeg-core.wasm) -gt 20000000

      - name: Commit generated local extension
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chrome-extension
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build local Image Studio extension for GitHub Desktop'
          git push
