name: Bump R19.3 video quality asset
on:
  push:
    paths:
      - '.github/workflows/bump-r193-video-quality.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump asset version
        shell: python
        run: |
          from pathlib import Path
          import re
          for name in ['index.html','direct/index.html']:
              p=Path(name)
              h=p.read_text(encoding='utf-8')
              h=re.sub(r'video-compressor\.js\?v=[^"\']+', 'video-compressor.js?v=r193-quality', h)
              p.write_text(h,encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/bump-r193-video-quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R19.3: expose max video size and protect quality"
          git push
