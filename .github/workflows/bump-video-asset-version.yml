name: Bump tested video compressor asset
on:
  push:
    paths:
      - '.github/workflows/bump-video-asset-version.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump asset version on both routes
        shell: bash
        run: |
          sed -i 's/video-compressor.js?v=r192-mini/video-compressor.js?v=r192-tested/g' index.html direct/index.html
          grep -q 'video-compressor.js?v=r192-tested' index.html
          grep -q 'video-compressor.js?v=r192-tested' direct/index.html
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/bump-video-asset-version.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R19.2 tested: bump video compressor asset version"
          git push
