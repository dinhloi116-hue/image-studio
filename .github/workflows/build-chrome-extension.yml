name: Build Chrome Extension
run-name: Package DHL Image Studio R20.16 (quality-first batch export)

on:
  push:
    branches: [main]
    paths:
      - 'chrome-extension/**'
      - '.github/workflows/build-chrome-extension.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: image-studio-chrome-package-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate extension
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool chrome-extension/manifest.json >/dev/null
          python -m json.tool chrome-extension/update.json >/dev/null
          node --check chrome-extension/popup.js
          node --check chrome-extension/app.js
          node --check chrome-extension/batch-editor.js
          grep -q 'async function encodeForExport' chrome-extension/batch-editor.js
          grep -q 'id="compressionMode"' chrome-extension/batch-editor.html
          test -s chrome-extension/batch-editor.html
          test -s chrome-extension/tool.html
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          m=json.loads(Path('chrome-extension/manifest.json').read_text())
          for size in (16,32,48,128):
              f=Path(f'chrome-extension/icons/icon{size}.png')
              raw=f.read_bytes()
              assert raw[:8]==b'\x89PNG\r\n\x1a\n',f
              assert struct.unpack('>II',raw[16:24])==(size,size),f
              assert m['icons'][str(size)]==f'icons/icon{size}.png'
          print('Verified extension icons, manifest and batch tool')
          PY
          grep -q '"manifest_version": 3' chrome-extension/manifest.json

      - name: Build ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/Image-Studio-Chrome dist/Image-Studio-Chrome-Extension.zip
          mkdir -p build/Image-Studio-Chrome dist
          cp -R chrome-extension/. build/Image-Studio-Chrome/
          cd build
          zip -qr ../dist/Image-Studio-Chrome-Extension.zip Image-Studio-Chrome
          cd ..
          test -s dist/Image-Studio-Chrome-Extension.zip
          unzip -t dist/Image-Studio-Chrome-Extension.zip >/dev/null

      - name: Publish latest ZIP to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/Image-Studio-Chrome-Extension.zip
          if git diff --cached --quiet; then
            echo 'ZIP unchanged.'
            exit 0
          fi
          git commit -m 'Build latest Chrome extension ZIP'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo 'Published up-to-date installable ZIP.'
              exit 0
            fi
            echo "Push failed, retry $attempt"
            sleep 3
          done
          echo 'ZIP publish failed after retries' >&2
          exit 1
