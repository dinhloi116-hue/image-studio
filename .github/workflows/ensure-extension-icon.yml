name: Ensure Image Studio Extension Icon

on:
  push:
    branches: [main]
    paths:
      - 'chrome-extension/manifest.json'
      - 'chrome-extension/icons/icon128.png'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Keep logo in manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('chrome-extension/manifest.json')
          m=json.loads(p.read_text(encoding='utf-8'))
          m['icons']={'16':'icons/icon128.png','32':'icons/icon128.png','48':'icons/icon128.png','128':'icons/icon128.png'}
          a=m.setdefault('action',{})
          a['default_title']='Mở Image Studio DHL'
          a['default_icon']={'16':'icons/icon128.png','32':'icons/icon128.png','48':'icons/icon128.png','128':'icons/icon128.png'}
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chrome-extension/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Keep custom Image Studio extension icon'
          git push
