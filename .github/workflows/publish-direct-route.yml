name: Publish clean direct route

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-direct-route.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create uncached direct route
        run: |
          mkdir -p direct
          cp index.html direct/index.html
          printf 'R19-DIRECT-%s\n' "$(git rev-parse --short HEAD)" > direct/version.txt
      - name: Commit direct route
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add direct/index.html direct/version.txt
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Publish uncached direct R19 route'
            git push
          fi
