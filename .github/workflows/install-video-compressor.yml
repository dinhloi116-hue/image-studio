name: Attach video compressor tab
on:
  push:
    paths:
      - '.github/workflows/install-video-compressor.yml'
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify compressor asset
        shell: bash
        run: |
          test -f assets/video-compressor.js
          node -e "new Function(require('fs').readFileSync('assets/video-compressor.js','utf8')); console.log('video JS parse OK')"
      - name: Attach tab to both web routes
        shell: python
        run: |
          from pathlib import Path
          import re
          tag='<script src="/image-studio/assets/video-compressor.js?v=r192-mini"></script>'
          for name in ['index.html','direct/index.html']:
              p=Path(name)
              h=p.read_text(encoding='utf-8')
              h=re.sub(r'<script src="/image-studio/assets/video-compressor\.js\?v=[^"]+"></script>\s*','',h)
              h=h.replace('</body>',tag+'\n</body>',1)
              p.write_text(h,encoding='utf-8')
      - name: Verify pages
        shell: bash
        run: |
          grep -q 'video-compressor.js?v=r192-mini' index.html
          grep -q 'video-compressor.js?v=r192-mini' direct/index.html
      - name: Commit R19.2
        shell: bash
        run: |
          rm -rf .video_parts
          rm -f .github/workflows/install-video-compressor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R19.2: add video compression tab"
          git push
