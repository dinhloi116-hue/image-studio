name: Install video compressor tab
on:
  push:
    paths:
      - '.github/workflows/install-video-compressor.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build video compressor asset
        shell: bash
        run: |
          mkdir -p assets
          cat .video_parts/01.b64 .video_parts/02.b64 .video_parts/03.b64 .video_parts/04.b64 .video_parts/05.b64 | base64 -d > assets/video-compressor.js
          test "$(wc -c < assets/video-compressor.js)" = "24834"
          echo "4c9797dc84af0478319e3cd7014e1ef5516e663f96e35d87ddb6bdc2534f70f0  assets/video-compressor.js" | sha256sum -c -
          node -e "new Function(require('fs').readFileSync('assets/video-compressor.js','utf8')); console.log('video JS parse OK')"
      - name: Attach tab to both web routes
        shell: python
        run: |
          from pathlib import Path
          tag='<script src="/image-studio/assets/video-compressor.js?v=r192"></script>'
          for name in ['index.html','direct/index.html']:
              p=Path(name)
              h=p.read_text(encoding='utf-8')
              if 'video-compressor.js' not in h:
                  h=h.replace('</body>',tag+'\n</body>',1)
              p.write_text(h,encoding='utf-8')
      - name: Commit update
        shell: bash
        run: |
          rm -rf .video_parts
          rm -f .github/workflows/install-video-compressor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R19.2: add browser video compression tab"
          git push
