<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Image Studio</title>
<style>
html,body{margin:0;background:#0b0f15;color:#e5e7eb;font-family:Segoe UI,Arial,sans-serif}#boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.box{max-width:620px}.spin{width:36px;height:36px;border:4px solid #283344;border-top-color:#3b82f6;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}#bootmsg{color:#cbd5e1;line-height:1.5}.err{color:#fca5a5!important;white-space:pre-wrap}
</style>
</head>
<body>
<div id="boot"><div class="box"><div class="spin"></div><b>Đang mở Image Studio...</b><p id="bootmsg">Đang nạp R19 trực tiếp...</p></div></div>
<script>window.__IMAGE_STUDIO_FULL='';</script>
<script src="app/full-01.js?v=6"></script>
<script src="app/full-02.js?v=6"></script>
<script src="app/full-03.js?v=6"></script>
<script src="app/full-04.js?v=6"></script>
<script src="app/full-05.js?v=6"></script>
<script src="app/full-06.js?v=6"></script>
<script src="app/full-07.js?v=6"></script>
<script src="app/full-08.js?v=6"></script>
<script>
(async()=>{
 const msg=document.getElementById('bootmsg');
 try{
   if(!window.__IMAGE_STUDIO_FULL || window.__IMAGE_STUDIO_FULL.length<50000) throw new Error('Dữ liệu R19 chưa tải đủ. Hãy Ctrl+F5 một lần.');
   if(typeof DecompressionStream==='undefined') throw new Error('Chrome/Edge hiện tại chưa hỗ trợ giải nén gzip.');
   msg.textContent='Đang khởi động Image Studio R19...';
   const b=window.__IMAGE_STUDIO_FULL;
   const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));
   const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
   if(!html.includes('r19-refined') || !html.includes('openRenameModeBtn')) throw new Error('Gói R19 không hợp lệ.');
   document.open(); document.write(html); document.close();
 }catch(e){
   msg.className='err'; msg.textContent='Không mở được Image Studio: '+(e?.message||e);
   console.error(e);
 }
})();
</script>
</body>
</html>
