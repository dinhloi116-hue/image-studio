<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Studio</title>
<style>html,body{margin:0;background:#0b0f15;color:#e5e7eb;font-family:Segoe UI,Arial,sans-serif}#boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.box{max-width:560px}.spin{width:36px;height:36px;border:4px solid #283344;border-top-color:#3b82f6;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body><div id="boot"><div class="box"><div class="spin"></div><b>Đang mở Image Studio...</b><p id="bootmsg">Vui lòng chờ một chút.</p></div></div>
<script>window.__IMAGE_STUDIO_PAYLOAD__=[];</script>
<script src="app/payload-01.js"></script>
<script src="app/payload-02.js"></script>
<script src="app/payload-03.js"></script>
<script src="app/payload-04.js"></script>
<script src="app/payload-05.js"></script>
<script src="app/payload-06.js"></script>
<script src="app/payload-07.js"></script>
<script src="app/payload-08.js"></script>
<script src="app/payload-09.js"></script>
<script src="app/payload-10.js"></script>
<script src="app/payload-11.js"></script>
<script src="app/payload-12.js"></script>
<script>
(async()=>{try{if(typeof DecompressionStream==='undefined')throw new Error('Trình duyệt quá cũ. Hãy mở bằng Chrome/Edge mới.');const b=window.__IMAGE_STUDIO_PAYLOAD__.join('');const a=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const html=await new Response(new Blob([a]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('bootmsg').textContent='Không mở được tool: '+(e.message||e)}})();
</script></body></html>
